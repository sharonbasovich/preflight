name: preflight

# PreFlight scans its own pull requests — the markdown report lands as a
# build artifact on every PR and is also posted (or updated) as a PR comment.
on:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    # This job checks out and runs PR code, so its token stays read-only.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Scan the PR diff
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff "origin/${{ github.base_ref }}...HEAD" > /tmp/pr.diff
          npm run --silent cli -- --json /tmp/pr.diff > preflight-findings.json || true
          npm run cli -- /tmp/pr.diff > preflight-report.md || true
          cat preflight-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: preflight-report
          path: |
            preflight-report.md
            preflight-findings.json

  comment:
    needs: scan
    runs-on: ubuntu-latest
    # No checkout or PR code runs in this job. Fork PRs still receive a
    # read-only token from GitHub, so the artifact remains the fallback.
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preflight-report
      - name: Post report as PR comment
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('preflight-report.md', 'utf8');
            const marker = '<!-- preflight-report -->';
            const body = `${marker}\n${report}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
